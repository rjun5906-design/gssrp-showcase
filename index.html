<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predictive Performance Analysts — GSSRP 2026, Kean University</title>
<meta name="description" content="Predictive Performance Analysts: four GSSRP 2026 research projects at Kean University applying machine learning to student performance, teaching quality, and mental health — with posters, live apps, and code.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

<style>
  :root{
    --paper:#FAFAF8;
    --card:#FFFFFF;
    --ink:#131417;
    --muted:#6E7075;
    --rule:#E5E5E0;
    --accent:#1B5E4B;
    --accent-soft:#ECF3F0;
    --pad:clamp(1.15rem, 5vw, 4rem);
    --gap:clamp(1.25rem, 2.6vw, 2.25rem);
    --sans:"Schibsted Grotesk", system-ui, sans-serif;
    --serif:"Source Serif 4", Georgia, serif;
    --mono:"JetBrains Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:1rem;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  img{display:block;max-width:100%}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
  .wrap{max-width:1180px;margin:0 auto;padding-inline:var(--pad)}

  /* ── header ───────────────────────────────────────── */
  .bar{
    position:sticky;top:0;z-index:40;
    background:color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);
    box-shadow:0 1px 0 rgba(19,20,23,.02), 0 6px 16px -12px rgba(19,20,23,.18);
  }
  .bar .wrap{display:flex;align-items:center;gap:1.5rem;padding-block:.55rem}
  .brand-block{display:flex;align-items:center;gap:.85rem;text-decoration:none;min-width:0}
  .brand-logo{width:58px;height:58px;object-fit:contain;flex:0 0 auto}
  .brand-text{display:flex;flex-direction:column;justify-content:center;line-height:1.2;min-width:0}
  .mark{font-weight:700;font-size:1.2rem;letter-spacing:-.015em;white-space:nowrap}
  .brand-sub{
    font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);white-space:nowrap;margin-top:.15rem;
  }
  .bar nav{margin-left:auto;display:flex;gap:1.4rem}
  .bar nav a{
    font-size:.875rem;color:var(--muted);text-decoration:none;
    padding-bottom:2px;border-bottom:1.5px solid transparent;
    transition:color .18s,border-color .18s;
  }
  .bar nav a:hover{color:var(--ink);border-bottom-color:var(--accent)}
  .header-right{
    display:flex;align-items:center;gap:.9rem;
    padding-left:1.1rem;margin-left:.4rem;border-left:1px solid var(--rule);
  }
  .visitor-pill{
    display:flex;align-items:center;gap:.4rem;
    font-family:var(--mono);font-size:.66rem;letter-spacing:.03em;
    color:var(--accent);background:var(--accent-soft);
    padding:.32rem .65rem;border-radius:100px;white-space:nowrap;
  }
  .visitor-pill .dot{
    width:6px;height:6px;border-radius:50%;background:#2E9E5B;flex:0 0 auto;
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @media (max-width:860px){ .header-right{display:none} }
  @media (max-width:560px){ .brand-sub{display:none} }

  /* ── section scaffolding ──────────────────────────── */
  section{padding-block:clamp(2.75rem,6vw,4.75rem)}
  .eyebrow{
    font-family:var(--mono);font-size:.7rem;font-weight:500;
    letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    margin:0 0 1.75rem;padding-top:1rem;border-top:1px solid var(--rule);
    display:flex;align-items:baseline;gap:.9rem;flex-wrap:wrap;
  }
  .eyebrow span{color:var(--muted);letter-spacing:.1em}

  /* ── hero ─────────────────────────────────────────── */
  .hero{padding-block:clamp(3.25rem,9vh,6.5rem) clamp(2rem,5vw,3.5rem)}
  .hero h1{
    font-size:clamp(2.2rem,5.6vw,4.1rem);font-weight:600;
    line-height:1.02;letter-spacing:-.035em;margin:0;max-width:19ch;
    text-wrap:balance;
  }
  .hero-lede{
    font-family:var(--serif);font-size:clamp(1.05rem,1.6vw,1.25rem);
    line-height:1.6;color:var(--muted);max-width:56ch;margin:1.5rem 0 0;
  }
  .facts{
    display:flex;flex-wrap:wrap;gap:.5rem .55rem;margin-top:2rem;
    font-family:var(--mono);font-size:.75rem;letter-spacing:.04em;
  }
  .facts b{
    font-weight:400;background:var(--accent-soft);color:var(--accent);
    padding:.35rem .7rem;border-radius:100px;
  }

  /* ── posters ──────────────────────────────────────── */
  .posters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:var(--gap)}
  .poster{margin:0}
  .poster-frame{
    display:block;position:relative;padding:13px;text-decoration:none;
    background:var(--card);border:1px solid var(--rule);
  }
  /* crop marks, like a print proof */
  .poster-frame::before{
    content:"";position:absolute;inset:5px;pointer-events:none;
    background:
      linear-gradient(var(--rule),var(--rule)) 0 0/11px 1px no-repeat,
      linear-gradient(var(--rule),var(--rule)) 0 0/1px 11px no-repeat,
      linear-gradient(var(--rule),var(--rule)) 100% 0/11px 1px no-repeat,
      linear-gradient(var(--rule),var(--rule)) 100% 0/1px 11px no-repeat,
      linear-gradient(var(--rule),var(--rule)) 0 100%/11px 1px no-repeat,
      linear-gradient(var(--rule),var(--rule)) 0 100%/1px 11px no-repeat,
      linear-gradient(var(--rule),var(--rule)) 100% 100%/11px 1px no-repeat,
      linear-gradient(var(--rule),var(--rule)) 100% 100%/1px 11px no-repeat;
  }
  .poster-frame:hover::before{
    background:
      linear-gradient(var(--accent),var(--accent)) 0 0/11px 1px no-repeat,
      linear-gradient(var(--accent),var(--accent)) 0 0/1px 11px no-repeat,
      linear-gradient(var(--accent),var(--accent)) 100% 0/11px 1px no-repeat,
      linear-gradient(var(--accent),var(--accent)) 100% 0/1px 11px no-repeat,
      linear-gradient(var(--accent),var(--accent)) 0 100%/11px 1px no-repeat,
      linear-gradient(var(--accent),var(--accent)) 0 100%/1px 11px no-repeat,
      linear-gradient(var(--accent),var(--accent)) 100% 100%/11px 1px no-repeat,
      linear-gradient(var(--accent),var(--accent)) 100% 100%/1px 11px no-repeat;
  }
  .poster-shot{
    position:relative;aspect-ratio:4/3;overflow:hidden;background:#F0F0EC;
    display:grid;place-items:center;
  }
  .poster-shot img{width:100%;height:100%;object-fit:cover;object-position:top center}
  .zoom{
    position:absolute;right:.55rem;bottom:.55rem;opacity:0;transform:translateY(4px);
    background:var(--ink);color:#fff;font-family:var(--mono);font-size:.68rem;
    letter-spacing:.08em;padding:.3rem .55rem;border-radius:3px;
    transition:opacity .2s,transform .2s;
  }
  .poster-frame:hover .zoom,.poster-frame:focus-visible .zoom{opacity:1;transform:none}
  .poster figcaption{padding-top:.95rem}
  .poster h3{font-size:1.05rem;font-weight:600;letter-spacing:-.012em;margin:0 0 .3rem}
  .poster p{font-family:var(--serif);color:var(--muted);margin:0;font-size:.95rem}
  .poster .meta{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;color:var(--muted);margin-top:.5rem}

  /* ── apps ─────────────────────────────────────────── */
  .apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:var(--gap)}
  .app{
    background:var(--card);border:1px solid var(--rule);padding:clamp(1.25rem,2.4vw,1.9rem);
    display:flex;gap:clamp(1.1rem,2.2vw,1.6rem);align-items:flex-start;
  }
  .qr{
    width:132px;height:132px;padding:8px;background:#fff;
    border:1px solid var(--rule);display:grid;place-items:center;
  }
  .qr svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
  .qr-fallback{font-family:var(--mono);font-size:.6rem;color:var(--muted);text-align:center;word-break:break-all}
  .app-body{min-width:0;flex:1}
  .app h3{font-size:1.2rem;font-weight:600;letter-spacing:-.02em;margin:0 0 .35rem}
  .app-kind{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:.5rem}
  .app p{font-family:var(--serif);color:var(--muted);margin:0 0 1.1rem;font-size:.95rem}
  .btns{display:flex;flex-wrap:wrap;gap:.5rem}
  .btn{
    font-family:var(--sans);font-size:.85rem;font-weight:500;text-decoration:none;
    padding:.5rem .95rem;border-radius:4px;border:1px solid var(--ink);
    background:var(--ink);color:#fff;transition:opacity .18s,border-color .18s;
  }
  .btn:hover{opacity:.82}
  .btn--ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
  .btn--ghost:hover{border-color:var(--ink);opacity:1}
  .scan-hint{
    font-family:var(--mono);font-size:.65rem;letter-spacing:.06em;
    color:var(--muted);text-align:center;margin:.5rem 0 0;width:132px;
  }

  /* ── repos ────────────────────────────────────────── */
  .repos{border-top:1px solid var(--rule)}
  .repo{
    display:flex;align-items:baseline;gap:clamp(.75rem,2vw,1.5rem);
    padding:1.05rem .5rem;border-bottom:1px solid var(--rule);
    text-decoration:none;transition:background .18s,padding-left .18s;
  }
  .repo:hover{background:var(--card);padding-left:.9rem}
  .repo-name{font-family:var(--mono);font-size:.9rem;font-weight:500;flex:0 0 auto}
  .repo-name .owner{color:var(--muted);font-weight:400}
  .repo-desc{font-family:var(--serif);color:var(--muted);font-size:.95rem;flex:1;min-width:0}
  .repo-lang{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;color:var(--muted);flex:0 0 auto}
  .repo-arrow{color:var(--accent);flex:0 0 auto;transition:transform .18s}
  .repo:hover .repo-arrow{transform:translateX(3px)}

  /* ── team ─────────────────────────────────────────── */
  .team{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:var(--gap) clamp(1rem,2vw,1.75rem)}
  .person{min-width:0}
  .avatar{
    aspect-ratio:1;overflow:hidden;background:var(--accent-soft);
    border-radius:50%;display:grid;place-items:center;margin-bottom:.85rem;
    max-width:150px;
  }
  .avatar img{width:100%;height:100%;object-fit:cover}
  .initials{font-size:1.5rem;font-weight:600;color:var(--accent);letter-spacing:.02em}
  .person h3{font-size:1rem;font-weight:600;letter-spacing:-.01em;margin:0 0 .15rem}
  .role{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:.5rem}
  .person p{font-family:var(--serif);font-size:.92rem;line-height:1.5;color:var(--muted);margin:0 0 .55rem}
  .person a{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule)}
  .person a:hover{color:var(--accent);border-bottom-color:var(--accent)}

  /* ── footer ───────────────────────────────────────── */
  footer{border-top:1px solid var(--rule);margin-top:clamp(2rem,5vw,3.5rem)}
  footer .wrap{
    display:flex;flex-wrap:wrap;gap:.6rem 1.75rem;padding-block:1.5rem 3rem;
    font-family:var(--mono);font-size:.7rem;letter-spacing:.07em;color:var(--muted);
  }

  /* ── lightbox ─────────────────────────────────────── */
  .lb{
    position:fixed;inset:0;z-index:100;background:rgba(14,15,17,.94);
    display:none;place-items:center;padding:clamp(3rem,7vw,3.5rem) clamp(.75rem,3vw,4.5rem);
  }
  .lb.is-open{display:grid}
  .lb img{max-width:100%;max-height:80vh;object-fit:contain;background:#fff;margin-inline:auto}
  .lb-cap{
    color:#E9E9E4;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;
    text-align:center;margin:.9rem 0 0;
  }
  .lb-close,.lb-prev,.lb-next{
    position:absolute;background:rgba(255,255,255,.12);border:0;color:#fff;
    width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:1.15rem;
    display:grid;place-items:center;transition:background .18s;
  }
  .lb-close:hover,.lb-prev:hover,.lb-next:hover{background:rgba(255,255,255,.28)}
  .lb-close{top:clamp(.75rem,3vw,1.75rem);right:clamp(.75rem,3vw,1.75rem)}
  .lb-prev{left:clamp(.4rem,2vw,1.75rem);top:50%;transform:translateY(-50%)}
  .lb-next{right:clamp(.4rem,2vw,1.75rem);top:50%;transform:translateY(-50%)}

  /* ── reveal + responsive ──────────────────────────── */
  .reveal{opacity:0;transform:translateY(14px);transition:opacity .65s ease,transform .65s cubic-bezier(.2,.7,.2,1)}
  .reveal.is-in{opacity:1;transform:none}

  @media (max-width:620px){
    .bar nav{gap:1rem}
    .bar nav a{font-size:.8rem}
    .app{flex-direction:column;align-items:center;text-align:center}
    .app-body{width:100%}
    .btns{justify-content:center}
    .repo{flex-wrap:wrap;gap:.3rem .9rem}
    .repo-desc{flex-basis:100%;order:3}
    .avatar{margin-inline:auto}
    .person{text-align:center}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *{transition:none !important;animation:none !important}
    .reveal{opacity:1;transform:none}
  }
</style>
</head>

document.title = SITE.group + ' \u2014 Research Showcase';
$('#h-title').textContent = SITE.title;
$('#h-lede').textContent = SITE.lede;
$('#h-facts').innerHTML = SITE.facts.map(f => '<b>' + esc(f) + '</b>').join('');

/* posters */
$('#c-posters').textContent = SITE.posters.length + ' presented';
$('#posters-grid').innerHTML = SITE.posters.map((p, i) =>
  '<figure class="poster reveal">' +
    '<a class="poster-frame" href="' + esc(p.full) + '" data-index="' + i + '">' +
      '<div class="poster-shot">' +
        '<img src="' + esc(p.thumb) + '" alt="' + esc(p.title) + '">' +
        '<span class="zoom">VIEW FULL SIZE</span>' +
      '</div>' +
    '</a>' +
    '<figcaption>' +
      '<h3>' + esc(p.title) + '</h3>' +
      '<p>' + esc(p.blurb) + '</p>' +
      '<div class="meta">' + esc(p.venue) + '</div>' +
    '</figcaption>' +
  '</figure>').join('');

/* apps */
$('#apps-grid').innerHTML = SITE.apps.map(a =>
  '<article class="app reveal">' +
    '<div>' +
      '<div class="qr" data-url="' + esc(a.url) + '"></div>' +
      '<p class="scan-hint">Scan to open</p>' +
    '</div>' +
    '<div class="app-body">' +
      '<span class="app-kind">' + esc(a.kind) + '</span>' +
      '<h3>' + esc(a.name) + '</h3>' +
      '<p>' + esc(a.blurb) + '</p>' +
      '<div class="btns">' +
        '<a class="btn" href="' + esc(a.url) + '">Open ' + esc(a.name) + '</a>' +
        (a.repo ? '<a class="btn btn--ghost" href="' + esc(a.repo) + '">Source</a>' : '') +
      '</div>' +
    '</div>' +
  '</article>').join('');

document.querySelectorAll('.qr').forEach(el => {
  const url = el.dataset.url;
  try {
    const q = qrcode(0, 'M');
    q.addData(url);
    q.make();
    el.innerHTML = q.createSvgTag({ scalable: true });
  } catch (e) {
    el.innerHTML = '<span class="qr-fallback">' + esc(url) + '</span>';
  }
});

/* repos */
$('#c-repos').textContent = SITE.repos.length + ' public repositories';
$('#repos-list').innerHTML = SITE.repos.map(r =>
  '<a class="repo reveal" href="https://github.com/' + esc(r.owner) + '/' + esc(r.name) + '">' +
    '<span class="repo-name"><span class="owner">' + esc(r.owner) + '/</span>' + esc(r.name) + '</span>' +
    '<span class="repo-desc">' + esc(r.desc) + '</span>' +
    '<span class="repo-lang">' + esc(r.lang) + '</span>' +
    '<span class="repo-arrow">\u2197</span>' +
  '</a>').join('');

/* team */
$('#c-team').textContent = SITE.team.length + ' people';
$('#team-grid').innerHTML = SITE.team.map(p =>
  '<div class="person reveal">' +
    '<div class="avatar"><img src="' + esc(p.photo) + '" alt="' + esc(p.name) + '" data-initials="' + esc(initials(p.name)) + '"></div>' +
    '<h3>' + esc(p.name) + '</h3>' +
    '<span class="role">' + esc(p.role) + '</span>' +
    '<p>' + esc(p.bio) + '</p>' +
    (p.link ? '<a href="' + esc(p.link) + '">GitHub \u2197</a>' : '') +
  '</div>').join('');

/* image fallbacks */
document.querySelectorAll('.avatar img').forEach(img => {
  img.addEventListener('error', () => {
    img.parentElement.innerHTML = '<span class="initials">' + img.dataset.initials + '</span>';
  });
});
document.querySelectorAll('.poster-shot img').forEach(img => {
  img.addEventListener('error', () => {
    const src = img.getAttribute('src');
    img.insertAdjacentHTML('afterend',
      '<span style="font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;color:var(--muted)">' + esc(src) + '</span>');
    img.remove();
  });
});

/* lightbox */
const lb = $('#lightbox'), lbImg = $('#lb-img'), lbCap = $('#lb-cap');
let current = 0, lastFocus = null;

function openLb(i) {
  current = (i + SITE.posters.length) % SITE.posters.length;
  const p = SITE.posters[current];
  lbImg.src = p.full;
  lbImg.alt = p.title;
  lbCap.textContent = (current + 1) + ' / ' + SITE.posters.length + ' \u2014 ' + p.title;
  lb.classList.add('is-open');
  document.body.style.overflow = 'hidden';
  $('#lb-close').focus();
}
function closeLb() {
  lb.classList.remove('is-open');
  document.body.style.overflow = '';
  if (lastFocus) lastFocus.focus();
}

document.querySelectorAll('.poster-frame').forEach(a => {
  a.addEventListener('click', e => { e.preventDefault(); lastFocus = a; openLb(+a.dataset.index); });
});
$('#lb-close').addEventListener('click', closeLb);
$('#lb-prev').addEventListener('click', () => openLb(current - 1));
$('#lb-next').addEventListener('click', () => openLb(current + 1));
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('is-open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') openLb(current - 1);
  if (e.key === 'ArrowRight') openLb(current + 1);
});
if (SITE.posters.length < 2) {
  $('#lb-prev').style.display = 'none';
  $('#lb-next').style.display = 'none';
}

/* footer */
$('#footer-bar').innerHTML = SITE.footer.map(f =>
  f.indexOf('@') > -1 ? '<span><a href="mailto:' + esc(f) + '">' + esc(f) + '</a></span>' : '<span>' + esc(f) + '</span>'
).join('');

/* scroll reveal */
const reduced = typeof window.matchMedia === 'function' &&
                window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!reduced && 'IntersectionObserver' in window) {
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } });
  }, { rootMargin: '0px 0px -8% 0px' });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
} else {
  document.querySelectorAll('.reveal').forEach(el => el.classList.add('is-in'));
}

/* live visitor counter — free, no-signup hit counter API */
(function(){
  const el = $('#visitor-count');
  if (!el) return;
  fetch('https://abacus.jasoncameron.dev/hit/gssrp-predictive-performance-analysts/homepage')
    .then(r => r.json())
    .then(data => {
      if (data && typeof data.value === 'number') {
        el.textContent = data.value.toLocaleString() + (data.value === 1 ? ' visitor' : ' visitors');
      } else {
        el.textContent = 'Visitors';
      }
    })
    .catch(() => { el.textContent = 'Visitors'; });
})();
</script>

</body>
</html>
